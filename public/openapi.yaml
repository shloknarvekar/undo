    UndoRequest:
      type: object
      required:
        - reason
        - requestedAt
        - signature
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: This isn't what I asked for.
          description: What went wrong, in the shopper's words.
        photo:
          type: string
          description: Optional photo of what arrived, as a base64 JPEG, PNG or WebP data URL (max 4 MB).
          pattern: ^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$
          example: >-
            data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
        requestedAt:
          type: string
          format: date-time
          description: When the shopper pressed Undo. Must be within 15 minutes of the server's clock.
          example: "2026-10-20T16:30:00.000Z"
        signature:
          type: string
          minLength: 80
          maxLength: 100
          description: Base64 Ed25519 signature of the undo signing message.
          example: derQBgmEoL8kvl3vfHVsmqTVAkGTSvb2ShqDoVFKdSC5U5PpGkYAUsDzgSd80QyEpGEPh4966mrEQ9CzBw0IDA==
      description: An Undo, signed by the shopper's device key.
      example:
        reason: This isn't what I asked for.
        requestedAt: "2026-10-20T16:30:00.000Z"
        signature: derQBgmEoL8kvl3vfHVsmqTVAkGTSvb2ShqDoVFKdSC5U5PpGkYAUsDzgSd80QyEpGEPh4966mrEQ9CzBw0IDA==
    Decision:
      type: object
      required:
        - verdict
        - confidence
        - liability
        - evidence
      properties:
        verdict:
          $ref: "#/components/schemas/Verdict"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the fault check is, from 0 to 1. Below 0.7 goes to a person.
          example: 1
        liability:
          $ref: "#/components/schemas/Liability"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
          description: Each finding behind the verdict and where it came from.
          example:
            - source: shopper
              finding: This isn't what I asked for.
            - source: mandate_check
              finding: "attribute:size: mandate required 10, agent bought 10.5"
      description: The fault check's verdict, who pays, and the evidence behind it.
      example:
        verdict: AGENT_FAULT
        evidence:
          - source: shopper
            finding: This isn't what I asked for.
          - source: mandate_check
            finding: "attribute:size: mandate required 10, agent bought 10.5"
        liability: agent_operator
        confidence: 1
    MoneyAction:
      type: object
      required:
        - type
        - reason
      properties:
        type:
          $ref: "#/components/schemas/MoneyActionType"
        reason:
          type: string
          description: Why, in plain words.
          example: "agent broke the mandate: full refund, liability on the agent operator"
        refundOnReturn:
          type: string
          description: On AUTHORIZE_RETURN, the amount refunded when the item comes back.
          example: "99.42"
        restockingFee:
          type: string
          description: On AUTHORIZE_RETURN.
          example: "17.55"
      description: What happens to the money after the verdict.
      example:
        type: REFUND_FULL
        reason: "agent broke the mandate: full refund, liability on the agent operator"
    UndoResult:
      type: object
      required:
        - orderId
        - decision
        - outcome
      properties:
        orderId:
          type: string
          format: uuid
          description: The order that was undone.
          example: edd288bc-42d0-41d3-9b87-14915f3ff2c6
        decision:
          $ref: "#/components/schemas/Decision"
        outcome:
          $ref: "#/components/schemas/UndoOutcome"
      description: The verdict and what happened to the money.
      example:
        orderId: edd288bc-42d0-41d3-9b87-14915f3ff2c6
        decision:
          verdict: AGENT_FAULT
          evidence:
            - source: shopper
              finding: This isn't what I asked for.
            - source: mandate_check
              finding: "attribute:size: mandate required 10, agent bought 10.5"
          liability: agent_operator
          confidence: 1
        outcome:
          action:
            type: REFUND_FULL
            reason: "agent broke the mandate: full refund, liability on the agent operator"
          status: REFUNDED
          paypal: {}
    MerchantRules:
      type: object
      required:
        - blockBelow
        - extendBelow
        - extendMinutes
        - blockUnverified
      properties:
        blockBelow:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Refuse agents scoring below this. Null turns it off.
          example: null
        extendBelow:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Give agents scoring below this a longer window. Null turns it off.
          example: 50
        extendMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          description: How much longer.
          example: 360
        blockUnverified:
          type: boolean
          description: Refuse agents without a registered operator key.
          example: false
      description: The store's rules for agents. They apply from the next checkout.
      example:
        blockBelow: null
        extendBelow: 50
        extendMinutes: 360
        blockUnverified: false
