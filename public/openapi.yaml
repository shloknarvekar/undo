    IntentMandate:
      type: object
      description: What the shopper signs. Its canonical JSON (sorted keys) is hashed with SHA-256 for the signing message.
      required:
        - version
        - id
        - createdAt
        - expiresAt
        - shopperKey
        - request
        - intent
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 1
          description: Mandate format version. Always 1.
          example: 1
        id:
          type: string
          format: uuid
          description: Mandate id, chosen when it was prepared.
          example: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
        createdAt:
          type: string
          format: date-time
          description: When the mandate was prepared.
          example: "2026-10-20T04:18:17.928Z"
        expiresAt:
          type: string
          format: date-time
          description: When the mandate stops working (14 days after it was prepared).
          example: "2026-11-03T04:18:17.928Z"
        shopperKey:
          type: string
          description: Base64 Ed25519 public key (32 bytes).
          example: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
        request:
          type: string
          maxLength: 1000
          description: The shopper's own words, verbatim.
          example: Buy me black men's running shoes, size 10, under $120
        intent:
          $ref: "#/components/schemas/IntentDraft"
        agent:
          $ref: "#/components/schemas/AgentRef"
        payWith:
          $ref: "#/components/schemas/PayWith"
