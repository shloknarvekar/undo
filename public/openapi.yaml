        - hash
      properties:
        seq:
          type: integer
          description: Position in the hash chain, starting at 1.
          example: 1
        hash:
          type: string
          description: SHA-256 of this event chained to the previous event's hash.
          example: 7bf66d54681f2b73e2f05ee0d49b5a68776908620751daaf0102b9f0b17fcac6
      description: The first event in the mandate's hash chain (MANDATE_SIGNED).
      example:
