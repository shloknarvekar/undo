    PaidWith:
      type: string
      enum:
        - approval
        - saved_wallet
      description: How a purchase was paid.
      example: approval
    MandateRequestStatus:
      type: string
      enum:
        - PENDING
        - SIGNED
        - EXPIRED
      description: Where a mandate request stands.
      example: PENDING
    EvidenceFormat:
      type: string
      enum:
        - undo-evidence-v1
      description: Evidence file format.
      example: undo-evidence-v1
    Verdict:
      type: string
      enum:
        - AGENT_FAULT
        - MERCHANT_FAULT
        - SHOPPER_CHANGED_MIND
        - INCONCLUSIVE
      description: Who was at fault.
      example: AGENT_FAULT
    EvidenceSource:
      type: string
      enum:
        - mandate_check
        - agent_record
        - delivered_photo
        - ai_judgement
        - shopper
      description: Where a finding came from.
      example: mandate_check
    MoneyActionType:
      type: string
      enum:
        - VOID
        - REFUND_FULL
        - OPEN_CLAIM
        - AUTHORIZE_RETURN
        - REVIEW
        - NONE
      description: What happens to the money.
      example: VOID
    RateLimitCode:
      type: string
      enum:
        - rate_limited
      description: The error code on a 429.
      example: rate_limited
    AnswerActionName:
      type: string
      enum:
        - answer
      description: Always answer.
      example: answer
    PrepareActionName:
      type: string
      enum:
        - prepare
      description: Always prepare.
      example: prepare
    SignActionName:
      type: string
      enum:
        - sign
      description: Always sign.
      example: sign
    Liability:
      type: string
      nullable: true
      enum:
        - agent_operator
        - merchant
        - shopper
      description: Who pays. Null when a person still has to decide.
      example: agent_operator
