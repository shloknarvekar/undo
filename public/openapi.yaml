components:
  parameters:
    MandateId:
      name: mandateId
      in: path
      required: true
      description: Mandate id.
      schema:
        type: string
        format: uuid
        description: Mandate id.
        example: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
    RequestId:
      name: requestId
      in: path
      required: true
      description: Mandate request id.
      schema:
        type: string
        format: uuid
        description: Mandate request id.
        example: 7d1f0c2a-3b4e-4f5a-9c6d-8e7f1a2b3c4d
    OrderId:
      name: orderId
      in: path
      required: true
      description: Undo order id.
      schema:
        type: string
        format: uuid
        description: Undo order id.
        example: edd288bc-42d0-41d3-9b87-14915f3ff2c6
  responses:
    InvalidRequest:
      description: The body failed validation; `issues` lists each problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
            issues:
              - code: too_small
                message: String must contain at least 3 character(s)
                path:
                  - request
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    Forbidden:
      description: Refused, for example a bad signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: bad_signature
    Conflict:
      description: The resource is not in a state that allows this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_undoable
            status: VOIDED
    Unprocessable:
      description: Valid shape, but the content can't be accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: stale_request
    RateLimited:
      description: Too many requests from this visitor, or the free-tier budget is spent.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            example: 120
            description: Seconds to wait before trying again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
          example:
            error: rate_limited
            detail: That's a lot of tries in a short time. Give it 2 minutes and try again.
            retryAfter: 120
    UpstreamError:
      description: PayPal, the catalog or the AI model failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: paypal_checkout_failed
            detail: PayPal returned 500
    Unavailable:
      description: The AI model is unavailable right now.
      content:
