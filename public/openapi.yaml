openapi: 3.0.3
info:
  title: Undo API
  version: 1.0.0
  description: |
    Ctrl+Z for AI agent purchases, built on PayPal.

    Undo sits between a shopping agent and PayPal. A shopper signs a mandate (what the agent may buy, for how much)
    with a key that never leaves their device. The agent shops inside it, PayPal only **authorizes** the money, and
    an undo window opens. Pressing Undo runs a fault check and routes the money: a free void inside the window, or a
    refund, a merchant claim or a return after capture. When the agent was at fault, its operator pays the merchant
    back through PayPal Payouts. Every step is written to a hash-chained event log anyone can verify.

    **Signing.** Mandates and undo requests are signed with Ed25519 by the shopper's device key. The API never
    signs for a shopper. The exact strings to sign are given with each operation.

    **Sandbox.** This deployment runs on the PayPal sandbox; no real money moves. Costly endpoints are rate limited
    per visitor and answer `429` with a `Retry-After` header when the limit or the free-tier budget is reached.

    **Agents.** Third-party agents usually connect over MCP (Streamable HTTP at `/api/mcp`, JSON-RPC, not described
    here). This document covers the HTTP API that the web app, agents and merchants call directly.
  contact:
    name: Undo
    url: https://undo-1c56.onrender.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-server-configuration:
    default-environment: Production
    default-server: Default
    environments:
      - name: Production
        servers:
          - name: Default
            url: https://undo-1c56.onrender.com
            description: Undo's API on Render.
        description: The live sandbox deployment. PayPal sandbox only; no real money moves.
servers:
  - url: https://undo-1c56.onrender.com
    description: Live sandbox deployment
security: []
tags:
  - name: Products
    description: Live product catalog search and detail, resolved to an exact variant.
  - name: Mandates
    description: Drafting, preparing, signing and reading shopper-signed intent mandates.
  - name: Mandate requests
    description: The shopper's side of a mandate an outside agent asked for.
  - name: Shopping
    description: Let Undo's agent shop inside a mandate and open a PayPal checkout that only authorizes the money.
  - name: Orders
    description: Purchases, their undo windows, the Undo button, and the evidence to verify them.
  - name: Merchant
    description: The store's view. Sandbox demo store; merchant sign-in comes with production use.
  - name: Service
    description: Health and deploy checks.
paths:
  /api/health:
    get:
      tags:
        - Service
      operationId: getHealth
      summary: Check the service
      description: >-
        Shallow health check. With `deep`, also proves the service can reach PayPal sandbox and the database. Never
        returns secret values.
      parameters:
        - name: deep
          in: query
          required: false
          description: Present (any value) to also check PayPal and the database.
          schema:
            type: string
            description: Present (any value) to also check PayPal and the database.
            example: "1"
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
                service: undo
                commit: 319894e
                configured:
                  paypal: true
                  channel3: true
                  database: true
        "503":
          description: A deep check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: false
                service: undo
                commit: a1dd1af
                configured:
                  paypal: true
                  channel3: true
                  database: true
                paypal: Client Authentication failed
  /api/products/search:
    post:
      tags:
        - Products
      operationId: searchProducts
      summary: Search products
      description: Searches the live catalog with structured filters. Rate limited per visitor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearch"
            example:
              query: black hoodie
              maxPrice: 80
              color: black
              limit: 5
        description: What to search for and how to filter it.
      responses:
        "200":
          description: Matching products with an offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResult"
              example:
                category: hoodies
                products:
                  - channel3Id: w25336I
                    title: UA Infinite Pro Men's Running Shoes
                    brand: Under Armour
                    description: >-
                      These men's running shoes from Under Armour, the UA Infinite Pro, are designed for endurance with
                      a focus on comfort and support. They feature a breathable e…
                    price: 116.97
                    currency: USD
                    imageUrl: >-
                      https://cdn.trychannel3.com/aed9ec20-0e99-49b6-b011-2425732889be?aid=01M5D44F1Y9VDE34RVPPTF1H15&mid=oKaH
                    sourceUrl: >-
                      https://buy.trychannel3.com/w25336I-oKaH-Wqce8l?o=01KVATPXMQW09XVTMRDEW2Q1Y9&aid=01M5D44F1Y9VDE34RVPPTF1H15
                    sourceDomain: underarmour.com
                    colors:
                      - "#1e1e20"
                      - "#d5d4d8"
                    attributes:
                      activity:
                        - Running
                      pattern:
                        - Texture
                        - Geometric
                      closure-type:
                        - Straps
                        - Lace-up
                      heel-height-type:
                        - Flat
                        - Low
                      footwear-material:
                        - Mesh
                        - Polyester
                      shoe-fit:
                        - Regular
                      shoe-features:
                        - Breathable design
                        - Cushioned
                      toe-style:
                        - Round
                      outsole-material:
                        - Rubber
                      footwear-support-type:
                        - Neutral
                        - Stability
                      lining-material:
                        - Synthetic
                    variant:
                      Size: "10.5"
                    variantOptions:
                      - name: Color
                        values:
                          - Black
                          - White
                      - name: Size
                        values:
                          - "7"
                          - "8"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/products/{productId}:
    get:
      tags:
        - Products
      operationId: getProduct
      summary: Get a product at a variant
      description: >
        Fresh product detail resolved to the requested variant. Pass options as `option_<Name>=<value>` query

        parameters, for example `option_Size=M&option_Color=Black`. `relaxed` lists any option the catalog could not
        honor.
      parameters:
        - name: productId
          in: path
          required: true
          description: Catalog product id (`channel3Id` from a search).
          schema:
            type: string
            description: Catalog product id (`channel3Id` from a search).
            example: w25336I
        - name: options
          in: query
          required: false
          description: Variant options as `option_<Name>` keys.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              description: The value for that option.
              example: "10.5"
            description: Variant options as `option_<Name>` keys.
            example:
              option_Size: "10.5"
              option_Color: Black
      responses:
        "200":
          description: The product at the closest available variant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
              example:
                product:
                  channel3Id: w25336I
                  title: UA Infinite Pro Men's Running Shoes
                  brand: Under Armour
                  description: >-
                    These men's running shoes from Under Armour, the UA Infinite Pro, are designed for endurance with a
                    focus on comfort and support. They feature a breathable e…
                  price: 116.97
                  currency: USD
                  imageUrl: >-
                    https://cdn.trychannel3.com/aed9ec20-0e99-49b6-b011-2425732889be?aid=01M5D44F1Y9VDE34RVPPTF1H15&mid=oKaH
                  sourceUrl: >-
                    https://buy.trychannel3.com/w25336I-oKaH-Wqce8l?o=01KVATPXMQW09XVTMRDEW2Q1Y9&aid=01M5D44F1Y9VDE34RVPPTF1H15
                  sourceDomain: underarmour.com
                  colors:
                    - "#1e1e20"
                    - "#d5d4d8"
                  attributes:
                    activity:
                      - Running
                    pattern:
                      - Texture
                      - Geometric
                    closure-type:
                      - Straps
                      - Lace-up
                    heel-height-type:
                      - Flat
                      - Low
                    footwear-material:
                      - Mesh
                      - Polyester
                    shoe-fit:
                      - Regular
                    shoe-features:
                      - Breathable design
                      - Cushioned
                    toe-style:
                      - Round
                    outsole-material:
                      - Rubber
                    footwear-support-type:
                      - Neutral
                      - Stability
                    lining-material:
                      - Synthetic
                  variant:
                    Size: "10.5"
                  variantOptions:
                    - name: Color
                      values:
                        - Black
                        - White
                    - name: Size
                      values:
                        - "7"
                        - "8"
                relaxed: []
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/mandates/draft:
    post:
      tags:
        - Mandates
      operationId: draftMandate
      summary: Draft a mandate from the shopper's words
      description: >-
        Turns a plain request into structured limits for the shopper to review. Nothing is stored. Rate limited per
        visitor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMandateRequest"
            example:
              request: A black hoodie in size M under $80
        description: The shopper's request in their own words.
      responses:
        "200":
          description: The draft and whether it can be signed as is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResult"
              example:
                draft:
                  item: black hoodie
                  category: hoodie
                  quantity: 1
                  maxPrice: 80
                  currency: USD
                  attributes:
                    color: black
                    size: M
                  mustAsk: []
                ready:
                  ok: true
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/mandates/prepare:
    post:
      tags:
        - Mandates
      operationId: prepareMandate
      summary: Build the exact mandate to sign
      description: |
        Returns the mandate the shopper's device must sign and the exact `signingMessage`
        (`undo-intent-mandate-v1:<sha256 of the canonical mandate JSON>`). Stateless; nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareMandate"
            example:
              request: A black hoodie in size M under $80
              draft:
                item: black hoodie
                category: hoodie
                quantity: 1
                maxPrice: 80
                currency: USD
                attributes:
                  color: black
                  size: M
                mustAsk: []
              shopperKey: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
        description: The draft, the shopper's words and the device key that will sign.
      responses:
        "200":
          description: The mandate and the string to sign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedMandate"
              example:
                mandate:
                  version: 1
                  id: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                  createdAt: "2026-10-20T04:18:17.928Z"
                  expiresAt: "2026-11-03T04:18:17.928Z"
                  shopperKey: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
                  request: Buy me black men's running shoes, size 10, under $120
                  intent:
                    item: running shoes
                    category: running shoes
                    quantity: 1
                    maxPrice: 120
                    currency: USD
                    attributes:
                      size: "10"
                      color: black
                    gender: male
                    mustAsk: []
                signingMessage: undo-intent-mandate-v1:7bf66d54681f2b73e2f05ee0d49b5a68776908620751daaf0102b9f0b17fcac6
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          description: The draft still has open questions or no budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReady"
              example:
                error: open_questions
                mustAsk:
                  - What size?
  /api/mandates:
    post:
      tags:
        - Mandates
      operationId: storeMandate
      summary: Store a signed mandate
      description: >-
        Re-verifies the signature, freshness, expiry and readiness, then writes the first event of the mandate's hash
        chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedMandate"
            example:
              mandate:
                version: 1
                id: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                createdAt: "2026-10-20T04:18:17.928Z"
                expiresAt: "2026-11-03T04:18:17.928Z"
                shopperKey: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
                request: Buy me black men's running shoes, size 10, under $120
                intent:
                  item: running shoes
                  category: running shoes
                  quantity: 1
                  maxPrice: 120
                  currency: USD
                  attributes:
                    size: "10"
                    color: black
                  gender: male
                  mustAsk: []
              signature: derQBgmEoL8kvl3vfHVsmqTVAkGTSvb2ShqDoVFKdSC5U5PpGkYAUsDzgSd80QyEpGEPh4966mrEQ9CzBw0IDA==
        description: The mandate and the shopper's signature over it.
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredMandate"
              example:
                id: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                digest: 7bf66d54681f2b73e2f05ee0d49b5a68776908620751daaf0102b9f0b17fcac6
                event:
                  seq: 1
                  hash: 91b50424c310c5106b3c9873427ada9d3ffccf45c9834d1c2df342316b5a25d8
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/mandates/{mandateId}:
    get:
      tags:
        - Mandates
      operationId: getMandate
      summary: Get a mandate and check its integrity
      description: The mandate, its status, the search it permits, and a fresh check of its digest, signature and event chain.
      parameters:
        - $ref: "#/components/parameters/MandateId"
      responses:
        "200":
          description: The mandate with a live integrity check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateView"
              example:
                mandate:
                  version: 1
                  id: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                  createdAt: "2026-10-20T04:18:17.928Z"
                  expiresAt: "2026-11-03T04:18:17.928Z"
                  shopperKey: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
                  request: Buy me black men's running shoes, size 10, under $120
                  intent:
                    item: running shoes
                    category: running shoes
                    quantity: 1
                    maxPrice: 120
                    currency: USD
                    attributes:
                      size: "10"
                      color: black
                    gender: male
                    mustAsk: []
                status: FULFILLED
                search:
                  query: black running shoes
                  category: running shoes
                  maxPrice: 120
                  color: black
                  gender: male
                integrity:
                  digestMatches: true
                  signatureValid: true
                  chainIntact: true
                events:
                  - seq: 0
                    type: MANDATE_SIGNED
                    createdAt: "2026-10-20T04:18:18.268Z"
                    hash: 91b50424c310c5106b3c9873427ada9d3ffccf45c9834d1c2df342316b5a25d8
                  - seq: 1
                    type: CART_PROPOSED
                    createdAt: "2026-10-20T04:18:18.832Z"
                    hash: 89f7646662727852af27cbdf1e326a17b6cc76c2bd462031bbf8f1f29622e323
        "404":
          $ref: "#/components/responses/NotFound"
  /api/mandates/{mandateId}/shop:
    post:
      tags:
        - Shopping
      operationId: shopMandate
      summary: Shop inside a mandate
      description: |
        Undo's agent searches, checks the cart against the signed limits, and opens a PayPal checkout in AUTHORIZE
        mode. Without a saved wallet the shopper approves at `approveUrl`; with one (and only if the mandate allows it)
        the money is held straight away. One live purchase per mandate. Rate limited per visitor.
      parameters:
        - $ref: "#/components/parameters/MandateId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopMandateRequest"
            example: {}
        description: Optional demo settings. Send {} for a normal run.
      responses:
        "201":
          description: Checkout opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResult"
              example:
                orderId: edd288bc-42d0-41d3-9b87-14915f3ff2c6
                approveUrl: https://www.sandbox.paypal.com/checkoutnow?token=1X507517Y8961004F
                status: CHECKOUT_CREATED
                windowEndsAt: null
                paidWith: approval
                cart:
                  title: UA Infinite Pro Men's Running Shoes
                  brand: Under Armour
                  variant:
                    Size: "10.5"
                    Color: Black
                  price: 116.97
                  currency: USD
                  quantity: 1
                  retailer: underarmour.com
                  imageUrl: >-
                    https://cdn.trychannel3.com/aed9ec20-0e99-49b6-b011-2425732889be?aid=01M5BRG5D3YC8J46QPWBYB58RG&mid=oKaH
                agent:
                  reasoning: Picked UA Infinite Pro Men's Running Shoes in Black / 10.5 — looked like the best match.
                  confidence: 0.9
                  unverified: []
                  guard:
                    relaxed: []
                    bypassed: true
                    violations:
                      - rule: attribute:size
                        actual: "10.5"
                        expected: "10"
                  considered:
                    - id: w25336I
                      ok: false
                      price: 116.97
                      title: UA Infinite Pro Men's Running Shoes
                undoWindow:
                  minutes: 1080
                  factors:
                    - factor: order total $116.97
                      minutes: 360
                    - factor: agent bypassed Undo's pre-purchase check
                      minutes: 720
                trust:
                  score: 50
                  tier: neutral
        "403":
          description: The store's rules refused this agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: agent_blocked
                detail: This store only accepts registered agent operators.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The mandate is not active, or a purchase is already open (`orderId` names it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: purchase_already_open
                orderId: edd288bc-42d0-41d3-9b87-14915f3ff2c6
        "422":
          description: No product fits the mandate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no_compliant_product
                considered: 8
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/mandate-requests/{requestId}:
    get:
      tags:
        - Mandate requests
      operationId: getMandateRequest
      summary: Get a mandate request
      description: The draft an outside agent asked the shopper to sign, who is asking, and whether it is signed yet.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
              example:
                id: 7d1f0c2a-3b4e-4f5a-9c6d-8e7f1a2b3c4d
                request: A black hoodie in size M under $80
                draft:
                  item: black hoodie
                  category: hoodie
                  quantity: 1
                  maxPrice: 80
                  currency: USD
                  attributes:
                    color: black
                    size: M
                  mustAsk: []
                ready:
                  ok: true
                agent:
                  name: Claude
                  verified: false
                status: PENDING
                mandateId: null
                expiresAt: "2026-10-21T18:00:00.000Z"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Mandate requests
      operationId: actOnMandateRequest
      summary: Answer, prepare or sign a mandate request
      description: |
        - `answer`: answers the agent's open questions; the draft is re-read from the new text.
        - `prepare`: the exact mandate this device's key must sign.
        - `sign`: stores the signed mandate; it must match the request byte for byte (same words, limits and agent).
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateRequestAction"
            example:
              action: answer
              answers:
                What size?: M
        description: The shopper's answer, a request to prepare the mandate, or the signed mandate.
      responses:
        "200":
          description: Answered (new draft) or prepared (mandate and signing message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequestActionResult"
              example:
                mandate:
                  version: 1
                  id: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                  createdAt: "2026-10-20T04:18:17.928Z"
                  expiresAt: "2026-11-03T04:18:17.928Z"
                  shopperKey: aHBQ5B27O2BiDV0oWgOigpsXZKjOfhcYYMch5pZ5H0c=
                  request: Buy me black men's running shoes, size 10, under $120
                  intent:
                    item: running shoes
                    category: running shoes
                    quantity: 1
                    maxPrice: 120
                    currency: USD
                    attributes:
                      size: "10"
                      color: black
                    gender: male
                    mustAsk: []
                  agent:
                    name: Claude
                    verified: false
                signingMessage: undo-intent-mandate-v1:7bf66d54681f2b73e2f05ee0d49b5a68776908620751daaf0102b9f0b17fcac6
        "201":
          description: Signed and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequestSigned"
              example:
                mandateId: 2f4069f0-2367-4f08-acc6-d9cf1cf6669a
                digest: 7bf66d54681f2b73e2f05ee0d49b5a68776908620751daaf0102b9f0b17fcac6
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order
      description: >-
        The purchase, the live undo window, the mandate behind it, and its verified event chain. Each event carries its
        proof.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
              example:
                order:
                  id: edd288bc-42d0-41d3-9b87-14915f3ff2c6
                  status: REFUNDED
                  amount: "116.97"
                  currency: USD
                  quantity: 1
                  product:
                    brand: Under Armour
                    price: 116.97
                    title: UA Infinite Pro Men's Running Shoes
                    colors:
                      - "#1e1e20"
                      - "#d5d4d8"
                    variant:
                      Size: "10.5"
                      Color: Black
                    currency: USD
                    imageUrl: >-
