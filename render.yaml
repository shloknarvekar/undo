# Render Blueprint for Undo — https://render.com/docs/blueprint-spec
# Zero-cost setup:
#   - Web service on Render's free plan (750 instance-hours/month covers one service 24/7).
#     Free services sleep after ~15 min idle; .github/workflows/keepalive.yml pings /api/health
#     once the repo is public (judging period) so judges don't hit a cold start.
#   - No Render Postgres: the free one is deleted after 30 days (before judging ends Dec 21).
#     The database will be Neon's free plan (no expiry); DATABASE_URL gets added when the app needs it.
# Secrets use sync: false, so Render asks for them in the dashboard; nothing secret lives in git.
services:
  - type: web
    name: undo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
