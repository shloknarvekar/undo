# Render Blueprint for Undo — https://render.com/docs/blueprint-spec
# Secrets use sync: false, so Render asks for them in the dashboard; nothing secret lives in git.
#
# Plans: free is fine for spikes. Before submitting (judging runs until Dec 21):
#   - web: starter, so judges don't hit a ~1 min cold start after 15 min idle
#   - database: a paid plan — free Postgres is deleted 30 days after creation
services:
  - type: web
    name: undo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: undo-db
          property: connectionString

databases:
  - name: undo-db
    plan: free
    databaseName: undo
    user: undo
